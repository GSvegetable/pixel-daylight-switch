<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f5">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Explore five living pixel-art worlds with a draggable glass day/night switch.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pixel Daylight Switch</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body class="mobile-app">
  <main class="mobile-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div class="brand-copy">
        <p class="eyebrow" data-i18n="eyebrow">A LITTLE WORLD, IN YOUR HAND</p>
        <h1>Pixel Daylight</h1>
      </div>
      <span class="version-mark">v3.0.0</span>
    </header>

    <section class="switch-card" aria-label="Day and night switch">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="now">YOUR WORLD</p>
          <h2 data-i18n="dayMode" id="daylight-label">Daylight</h2>
        </div>
        <span class="live-indicator"><i></i><span data-i18n="live">LIVE WORLD</span></span>
      </div>
      <div class="switch-stage">
        <div data-ld-part="toggle-daylight" data-scene="countryside" lang="en">
          <canvas class="scene" aria-hidden="true"></canvas>
          <button class="hit" type="button" role="switch" aria-checked="false" aria-label="Day/night switch"></button>
          <span class="vh" role="status" aria-live="polite" data-status></span>
          <span class="probe" aria-hidden="true"></span>
        </div>
      </div>
      <p class="hint" data-i18n="dragHint">Drag the glass lens to move between day and night</p>
    </section>

    <section class="scene-panel" aria-labelledby="scene-title">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow" data-i18n="chooseWorld">CHOOSE YOUR WORLD</p>
          <h2 id="scene-title" data-i18n="scenes">Five pixel scenes</h2>
        </div>
        <span class="scene-count">01 <span>/</span> 05</span>
      </div>
      <div class="scene-picker" role="group" aria-label="Choose a scene">
        <button class="scene-choice is-active" type="button" data-scene-choice="countryside" aria-pressed="true"><span class="scene-icon">🏡</span><span data-i18n="countryside">Countryside</span></button>
        <button class="scene-choice" type="button" data-scene-choice="japanese-street" aria-pressed="false"><span class="scene-icon">🏮</span><span data-i18n="japan">Japanese street</span></button>
        <button class="scene-choice" type="button" data-scene-choice="apartment" aria-pressed="false"><span class="scene-icon">🪴</span><span data-i18n="apartment">Apartment</span></button>
        <button class="scene-choice" type="button" data-scene-choice="seaside" aria-pressed="false"><span class="scene-icon">🌊</span><span data-i18n="seaside">Seaside</span></button>
        <button class="scene-choice" type="button" data-scene-choice="mountain-cabin" aria-pressed="false"><span class="scene-icon">🏔️</span><span data-i18n="mountain">Mountain cabin</span></button>
      </div>
    </section>

    <section class="world-tools" aria-label="World settings">
      <div class="tool-copy">
        <span class="tool-icon">❄</span>
        <div><strong data-i18n="weather">Weather</strong><small data-i18n="snowDesc">Add gentle snowfall to the world</small></div>
      </div>
      <button class="toggle-chip" id="weather-toggle" type="button" aria-pressed="false"><span class="toggle-dot"></span><span data-i18n="snow">Snow</span></button>
    </section>

    <footer class="app-footer">
      <span>PIXEL DAYLIGHT SWITCH</span>
      <span data-i18n="footer">Five scenes · One tiny world</span>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';
      var panel;
      var browserLanguage = (navigator.language || 'en').toLowerCase();
      var lang = browserLanguage.indexOf('ja') === 0 ? 'ja' : browserLanguage.indexOf('zh') === 0 ? 'zh-CN' : 'en';
      var copy = {
        en: {eyebrow:'A LITTLE WORLD, IN YOUR HAND',now:'YOUR WORLD',dayMode:'Daylight',nightMode:'Nightfall',live:'LIVE WORLD',dragHint:'Drag the glass lens to move between day and night',chooseWorld:'CHOOSE YOUR WORLD',scenes:'Five pixel scenes',countryside:'Countryside',japan:'Japanese street',apartment:'Apartment',seaside:'Seaside',mountain:'Mountain cabin',weather:'Weather',snowDesc:'Add gentle snowfall to the world',snow:'Snow',footer:'Five scenes · One tiny world'},
        'zh-CN': {eyebrow:'掌心里的微缩世界',now:'当前世界',dayMode:'白昼',nightMode:'夜幕',live:'世界正在运转',dragHint:'拖动玻璃镜片，在白昼与黑夜之间切换',chooseWorld:'选择你的世界',scenes:'五种像素场景',countryside:'乡间小屋',japan:'日本街道',apartment:'现代公寓',seaside:'海边灯塔',mountain:'山间木屋',weather:'天气',snowDesc:'为这个世界加一场轻柔的雪',snow:'飘雪',footer:'五种场景 · 一个小小世界'},
        ja: {eyebrow:'手のひらの小さな世界',now:'あなたの世界',dayMode:'昼',nightMode:'夜',live:'世界が動いています',dragHint:'ガラスレンズをドラッグして昼と夜を切り替えます',chooseWorld:'世界を選ぶ',scenes:'5つのピクセルシーン',countryside:'田園の家',japan:'日本の街並み',apartment:'モダンな部屋',seaside:'海辺の灯台',mountain:'山小屋',weather:'天気',snowDesc:'世界にやさしい雪を降らせます',snow:'雪',footer:'5つのシーン · ひとつの小さな世界'}
      };
      var strings = copy[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (strings[key]) el.textContent = strings[key];
      });
      var root = document.querySelector('[data-ld-part="toggle-daylight"]');
      root.lang = lang;
      var hit = root.querySelector('.hit');
      hit.setAttribute('aria-label', lang === 'ja' ? '昼夜スイッチ' : lang === 'zh-CN' ? '昼夜开关' : 'Day/night switch');
      var dayLabel = document.getElementById('daylight-label');
      root.addEventListener('daylight:change', function (event) {
        dayLabel.textContent = event.detail.night ? strings.nightMode : strings.dayMode;
      });
      var choices = Array.prototype.slice.call(document.querySelectorAll('[data-scene-choice]'));
      var sceneIndex = {countryside:'01','japanese-street':'02',apartment:'03',seaside:'04','mountain-cabin':'05'};
      function selectScene(name) {
        if (root.dataset.scene === name) return;
        root.dataset.startNight = String(root.querySelector('.hit').getAttribute('aria-checked') === 'true');
        if (window.PixelDaylightSwitch) window.PixelDaylightSwitch.unmount(root);
        root.dataset.scene = name;
        if (window.PixelDaylightSwitch) window.PixelDaylightSwitch.mount(root);
        choices.forEach(function (button) {
          var active = button.dataset.sceneChoice === name;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        document.querySelector('.scene-count').innerHTML = sceneIndex[name] + ' <span>/</span> 05';
      }
      choices.forEach(function (button) {
        button.addEventListener('click', function () { selectScene(button.dataset.sceneChoice); });
      });
      var weatherButton = document.getElementById('weather-toggle');
      weatherButton.addEventListener('click', function () {
        var enabled = weatherButton.getAttribute('aria-pressed') !== 'true';
        root.dataset.startNight = String(root.querySelector('.hit').getAttribute('aria-checked') === 'true');
        if (window.PixelDaylightSwitch) window.PixelDaylightSwitch.unmount(root);
        root.dataset.weather = enabled ? 'snow' : 'default';
        if (window.PixelDaylightSwitch) window.PixelDaylightSwitch.mount(root);
        weatherButton.setAttribute('aria-pressed', String(enabled));
        weatherButton.classList.toggle('is-on', enabled);
      });
      function showDiagnostic(title, detail) {
        try {
          if (!panel) {
            panel = document.createElement('pre');
            panel.id = 'pds-diagnostic';
            panel.setAttribute('role', 'alert');
            panel.setAttribute('aria-live', 'assertive');
            document.body.appendChild(panel);
          }
          panel.textContent = title + (detail ? '\n\n' + String(detail) : '');
          panel.style.display = 'block';
        } catch (displayError) {
          try { console.error('[PDS diagnostic display failed]', displayError); } catch (_) {}
        }
      }
      window.__PDS_DIAG__ = {
        show: showDiagnostic,
        error: function (error) {
          showDiagnostic('JavaScript Error', error && (error.stack || error.message) || String(error || 'Unknown error'));
        }
      };
      window.addEventListener('error', function (event) {
        if (event.target && event.target !== window) {
          var target = event.target;
          showDiagnostic('Resource Load Failed', (target.src || target.href || target.tagName || 'unknown resource') + '\n' + (event.message || 'The resource could not be loaded'));
          return;
        }
        var where = event.filename ? '\n' + event.filename + ':' + (event.lineno || 0) + ':' + (event.colno || 0) : '';
        showDiagnostic('JavaScript Error', (event.message || 'Unknown window error') + where + (event.error && event.error.stack ? '\n' + event.error.stack : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        showDiagnostic('Unhandled Promise Rejection', reason && (reason.stack || reason.message) || String(reason || 'Unknown rejection'));
      });
      var loadApp = function () {
        var appScript = document.createElement('script');
        appScript.src = './app.js';
        appScript.onload = function () {
          window.setTimeout(function () {
            var canvas = root.querySelector('canvas.scene');
            var rect = root.getBoundingClientRect();
            if (!canvas) showDiagnostic('App Initialization Failed', 'The renderer did not create a scene canvas.');
            else if (!canvas.width || !canvas.height || !rect.width || !rect.height) {
              showDiagnostic('Canvas Size Error', 'canvas=' + canvas.width + 'x' + canvas.height + ', root=' + rect.width + 'x' + rect.height);
            }
          }, 2500);
        };
        appScript.onerror = function () {
          showDiagnostic('Resource Load Failed', 'app.js could not be loaded from: ' + appScript.src);
        };
        document.body.appendChild(appScript);
      };
      var pluginScript = document.createElement('script');
      pluginScript.src = './scene-plugin.js';
      pluginScript.onload = loadApp;
      pluginScript.onerror = function () {
        showDiagnostic('Resource Load Failed', 'scene-plugin.js could not be loaded from: ' + pluginScript.src);
      };
      document.body.appendChild(pluginScript);
    })();
  </script>
</body>
</html>

name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node }} package and SSR checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: node --check app.js && node --check index.cjs && node --check index.mjs
      - name: Run package and SSR tests
        run: npm test
      - name: Verify packed files
        run: npm pack --dry-run

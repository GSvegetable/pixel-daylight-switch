<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Daylight Switch — Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8e8e3}
body{display:grid;place-items:center}
#switch{width:min(94%,760px);margin:auto}
@media(prefers-color-scheme:dark){html,body{background:#202329}}
</style>
</head>
<body>
<div id="switch" data-ld-part="toggle-daylight"></div>
<script>
(() => {
 const params = new URLSearchParams(location.search);
 const root = document.getElementById('switch');
 const keys = ['speed','refraction','bezel','start-night','friction','bounce','dispersion','shine','time-speed','weather'];
 for (const key of keys) {
   const value=params.get(key);
   if(value!==null) root.setAttribute('data-'+key,value);
 }
})();
</script>
<script src="./app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-night="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>像素昼夜开关 · 实验室</title>
<style>
:root{--bg:#dbe6ee;--surface:#f4f8fa;--ink:#1b2146;--muted:#566680;--line:#b4c4d2;--accent:#efa02c;color-scheme:light}
:root[data-night="1"]{--bg:#141936;--surface:#1d2347;--ink:#ecebf7;--muted:#9aa3c7;--line:#36406f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;transition:background-color .3s,color .3s; overflow-x:hidden;}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px}
.top b{font-size:17px}.top span{color:var(--muted);margin-left:8px}
.top nav{display:flex;gap:16px;font-size:14px}

/* 预览区剥离边框，开启 GPU 加速层 */
.stage-col{position:sticky;top:0;z-index:5;background:var(--bg);padding:24px 18px 12px;transition:background-color .3s}
.stage{
  position:relative; display:flex; justify-content:center; align-items:center; min-height:240px;
  transform: translateZ(0); /* 强制开启 GPU 硬件加速，防止闪烁 */
  will-change: transform;
}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted);text-align:center}

.panel{padding:0 18px}
h2{font-size:14px;margin:22px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.chip,.tabs button,.copy{font:inherit;color:var(--ink);cursor:pointer}
.chip{flex:none;border:2px solid var(--ink);background:transparent;padding:6px 12px;font-size:13px;transition:all .2s}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;border:2px solid var(--ink)}
.tabs button{flex:1;border:0;background:transparent;padding:8px 0}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}

/* 修复进度条滑动卡顿和触摸手感 */
.ctl{margin:20px 0; touch-action: pan-y; }
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
output{font:13px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:bold}
input[type=range]{
  -webkit-appearance:none; appearance:none; display:block; width:100%; height:30px; margin:0;
  background:transparent; cursor:pointer; --p:50%;
}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--ink) var(--p),var(--line) var(--p));}
input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,var(--ink) var(--p),var(--line) var(--p));}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:20px; height:26px; margin-top:-10px; background:var(--surface);
  border:2px solid var(--ink); border-radius:0; box-shadow:2px 2px 0 var(--line);
}
input[type=range]::-moz-range-thumb{
  width:16px; height:22px; background:var(--surface); border:2px solid var(--ink);
  border-radius:0; box-shadow:2px 2px 0 var(--line);
}

select{font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--ink);padding:5px 10px}
.check{display:flex;align-items:center;gap:10px;margin:20px 0}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}

.codehead{display:flex;align-items:center;justify-content:space-between}
.codehead h2{margin:26px 0 10px}
.copy{border:2px solid var(--ink);background:transparent;padding:3px 12px;font-size:13px;transition:all .2s}
.copy:hover{background:var(--ink);color:var(--surface)}
pre{margin:0;padding:14px;background:var(--surface);border:2px solid var(--ink);overflow:auto;font:12px/1.7 ui-monospace,Menlo,monospace;color:var(--ink)}

.dock{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line)}
.dock span{font-size:13px;color:var(--muted)}
.apply{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--accent);color:#fff;padding:9px 22px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:all .1s}
.apply:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.apply[data-clean]{background:transparent;color:var(--ink);box-shadow:3px 3px 0 var(--line)}

@media(min-width:900px){
main{max-width:1120px;margin:0 auto;padding:8px 28px 40px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:44px;align-items:start}
.top{max-width:1120px;margin:0 auto;padding:18px 28px}
.stage-col{top:16px;padding:0}
.panel{padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div><b>像素昼夜开关</b><span>实验室</span></div>
  <nav><a href="./index.html">返回演示</a><a href="./README.md">文档</a></nav>
</header>

<main>
<section class="stage-col">
  <div class="stage" id="stage">
    <!-- 给外层加点底色防白闪，彻底消除闪烁 -->
    <div style="width: 100%; max-width: 640px; background: var(--surface); padding: 20px; box-sizing: border-box;">
      <div id="preview-container" data-ld-part="toggle-daylight"></div>
    </div>
  </div>
  <p class="hint">直接拖动滑块即可调整，点「应用参数」生效。</p>
</section>

<section class="panel">
  <h2>预设场景</h2>
  <div class="chips" id="chips"></div>
  
  <h2>详细参数</h2>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panes"></div>
  
  <div class="codehead"><h2>嵌入代码</h2><button class="copy" id="copy">复制代码</button></div>
  <pre id="snippet"></pre>
  
  <div class="dock">
    <span id="status"></span>
    <button class="apply" id="apply">应用参数</button>
  </div>
</section>
</main>

<script src="https://gsvegetable.github.io/pixel-daylight-switch/app.js"></script>

<script>
(()=>{
const $=id=>document.getElementById(id);
const root = $('preview-container');

const groups=[
 ['运动手感',[
   ['speed','基础滑行速度',3,25,.1],
   ['friction','惯性阻尼',0.1,0.95,.01],
   ['bounce','边缘回弹力度',0,20,.5]
 ]],
 ['液态玻璃',[
   ['refraction','折射强度',0.8,3.0,.01],
   ['bezel','边缘厚度',0.01,0.12,.001],
   ['dispersion','彩虹色散',0,0.4,.01],
   ['shine','表面高光',0,2.0,.05]
 ]],
 ['像素世界',[
   ['timeSpeed','时间流速',0,5,.1]
 ]]
];

const nums = groups.flatMap(g=>g[1]);
const fields = [...nums.map(n=>n[0]), 'weather', 'startNight'];
const attr = {
  speed:'speed', friction:'friction', bounce:'bounce', 
  refraction:'refraction', bezel:'bezel', dispersion:'dispersion', shine:'shine', 
  timeSpeed:'time-speed', weather:'weather', startNight:'start-night'
};

const defaults = {
  speed:9.5, friction:0.6, bounce:3.2, 
  refraction:1.24, bezel:0.046, dispersion:0.05, shine:0.44, 
  timeSpeed:1, weather:'default', startNight:false
};

const presets = {
  default: {...defaults},
  cinematic: { speed:10, friction:0.8, bounce:5, refraction:2.2, bezel:0.08, dispersion:0.25, shine:1.2, timeSpeed:0.5, weather:'default', startNight:false },
  snow: { speed:9.5, friction:0.5, bounce:6, refraction:1.5, bezel:0.05, dispersion:0.15, shine:0.6, timeSpeed:1.5, weather:'snow', startNight:true },
  frozen: { ...defaults, timeSpeed:0, weather:'snow', startNight:true }
};
const names = { default:'原始状态', cinematic:'夸张玻璃', snow:'极寒雪夜', frozen:'时间冻结' };

let applied = null;

// 渲染 DOM 结构
$('chips').innerHTML = Object.keys(names).map(k=>`<button class="chip" data-p="${k}" aria-pressed="${k==='default'}">${names[k]}</button>`).join('');
$('tabs').innerHTML = groups.map((g,i)=>`<button role="tab" id="t${i}" aria-selected="${i===0}" aria-controls="p${i}">${g[0]}</button>`).join('');
$('panes').innerHTML = groups.map((g,i)=>`<div role="tabpanel" id="p${i}" aria-labelledby="t${i}"${i?' hidden':''}>`+
 g[1].map(([id,name,min,max,step])=>`<div class="ctl"><div class="row"><label for="${id}">${name}</label><output id="${id}Out" for="${id}"></output></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}"></div>`).join('')+
 (i===2?`<div class="ctl"><div class="row"><label for="weather">天气特效</label><select id="weather"><option value="default">无</option><option value="snow">飘雪</option></select></div></div><label class="check"><input id="startNight" type="checkbox">默认从夜晚开始</label>`:'')+
 '</div>').join('');

const read = ()=>{ const c={}; for(const id of fields) c[id] = id==='weather'?$(id).value : id==='startNight'?$(id).checked : Number($(id).value); return c; };
const set = c=>{ for(const id of fields){ if(id==='startNight') $(id).checked=!!c[id]; else $(id).value=c[id]; } updateUI(); mark(); };

// 更新代码和滑块进度条的 UI
function updateUI() {
  for(const n of nums) {
    const el=$(n[0]);
    $(n[0]+'Out').textContent = Number(el.value).toFixed((String(n[4]).split('.')[1]||'').length);
    el.style.setProperty('--p', (el.value-n[2])/(n[3]-n[2])*100+'%');
  }
}

function generateCode() {
  const c = read();
  const a = fields.filter(id=>c[id]!==defaults[id]).map(id=>`  data-${attr[id]}="${c[id]}"`);
  const el = a.length ? ['<div','  data-ld-part="toggle-daylight"',...a,'></div>'].join('\n') : '<div data-ld-part="toggle-daylight"></div>';
  $('snippet').textContent = el + '\n<script src="https://gsvegetable.github.io/pixel-daylight-switch/app.js"><\/script>';
}

function mark(){
  const dirty = JSON.stringify(read()) !== JSON.stringify(applied);
  $('status').textContent = dirty ? '参数有变动，尚未应用' : '参数已是最新';
  $('apply').toggleAttribute('data-clean', !dirty);
}

// 防抖变量，解决滑动卡顿
let isTicking = false;

function handleInput() {
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false'));
  if (!isTicking) {
    window.requestAnimationFrame(() => {
      updateUI(); // 滑动时只更新 UI，不生成代码，保证极致丝滑
      isTicking = false;
    });
    isTicking = true;
  }
}

function handleChange() {
  generateCode();
  mark();
}

function apply(){
  const c = read();
  applied = c;
  
  // 使用 requestAnimationFrame 让浏览器在重绘前完成 DOM 替换，消除白屏闪烁
  requestAnimationFrame(() => {
    if (window.PixelDaylightSwitch) window.PixelDaylightSwitch.unmount(root);
    root.innerHTML = ''; 
    for (const id of fields) {
      if (id === 'startNight') {
        if (c[id]) root.setAttribute('data-start-night', 'true');
        else root.removeAttribute('data-start-night');
      } else if (id === 'weather') {
        if (c[id] !== 'default') root.setAttribute('data-weather', c[id]);
        else root.removeAttribute('data-weather');
      } else {
        root.setAttribute(`data-${attr[id]}`, c[id]);
      }
    }
    if (window.PixelDaylightSwitch) window.PixelDaylightSwitch.mount(root);
    
    // 同步外层深色模式
    document.documentElement.dataset.night = c.startNight ? '1' : '0';
    
    generateCode();
    mark();
  });
}

// 绑定事件
fields.forEach(id => {
  const el = $(id);
  if (id === 'weather' || id === 'startNight') {
    el.addEventListener('change', () => { handleInput(); handleChange(); });
  } else {
    el.addEventListener('input', handleInput);   // 滑动时高频触发
    el.addEventListener('change', handleChange); // 松手时触发一次
  }
});

document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', ()=>{ 
  set(presets[b.dataset.p]); 
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); 
  apply(); 
}));

const tabs=[...document.querySelectorAll('.tabs button')];
tabs.forEach((t,i)=>{
 t.addEventListener('click', ()=>tabs.forEach((x,j)=>{ x.setAttribute('aria-selected',j===i); $('p'+j).hidden=j!==i; }));
});

$('apply').addEventListener('click', apply);
$('copy').addEventListener('click', async()=>{
 const b=$('copy');
 try { await navigator.clipboard.writeText($('snippet').textContent); b.textContent='已复制'; }
 catch { b.textContent='复制失败'; }
 setTimeout(()=>b.textContent='复制代码', 1500);
});

// 初始化
set(defaults);
apply();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-night="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dbe6ee">
<title>像素昼夜开关 · 实验室</title>
<style>
:root{--bg:#dbe6ee;--surface:#f4f8fa;--ink:#1b2146;--muted:#566680;--line:#b4c4d2;--shadow:#9db0c2;--accent:#efa02c;--on:#1b2146;color-scheme:light}
:root[data-night="1"]{--bg:#141936;--surface:#1d2347;--ink:#ecebf7;--muted:#9aa3c7;--line:#36406f;--shadow:#090c20;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
body,.stage-col,.stage,.dock,pre,button,select{transition:background-color .9s,border-color .9s,color .9s}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px}
.top b{font-size:17px}.top span{color:var(--muted);margin-left:8px}
.top nav{display:flex;gap:16px;font-size:14px}
.stage-col{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 18px 12px}
.stage{position:relative;height:min(38vh,280px);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);background:var(--surface);overflow:hidden}
/* 顺手帮你加了个平滑透明过渡，防止切参数时 iframe 白屏闪烁 */
.stage iframe{display:block;width:100%;height:100%;border:0;transition:opacity 0.3s ease}
.stage.busy iframe{opacity:0.3}
.stage.busy:after{content:"正在重建预览…";position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--muted)}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
.panel{padding:0 18px}
h2{font-size:14px;margin:22px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.chip,.tabs button,.copy{font:inherit;color:var(--ink);cursor:pointer}
.chip{flex:none;border:2px solid var(--ink);background:transparent;padding:6px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on)}
.tabs{display:flex;border:2px solid var(--ink)}
.tabs button{flex:1;border:0;background:transparent;padding:8px 0}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.ctl{margin:20px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
output{font:13px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin:0;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;margin-top:-10px;background:var(--surface);border:2px solid var(--ink);border-radius:0;box-shadow:2px 2px 0 var(--shadow)}
input[type=range]::-moz-range-thumb{width:14px;height:22px;background:var(--surface);border:2px solid var(--ink);border-radius:0;box-shadow:2px 2px 0 var(--shadow)}
select{font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--ink);padding:5px 10px}
.check{display:flex;align-items:center;gap:10px;margin:20px 0}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.codehead{display:flex;align-items:center;justify-content:space-between}
.codehead h2{margin:26px 0 10px}
.copy{border:2px solid var(--ink);background:transparent;padding:3px 12px;font-size:13px}
pre{margin:0;padding:14px;background:var(--surface);border:2px solid var(--ink);overflow:auto;font:12px/1.7 ui-monospace,Menlo,monospace;color:var(--ink)}
.dock{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--ink)}
.dock span{font-size:13px;color:var(--muted)}
.apply{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--accent);color:var(--on);padding:9px 22px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.apply:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.apply[data-clean]{background:transparent;color:var(--ink)}
@media(min-width:900px){
main{max-width:1120px;margin:0 auto;padding:8px 28px 40px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:44px;align-items:start}
.top{max-width:1120px;margin:0 auto;padding:18px 28px}
.stage-col{top:16px;padding:0}
.stage{height:min(68vh,560px)}
.panel{padding:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div><b>像素昼夜开关</b><span>实验室</span></div><nav><a href="./index.html">演示</a><a href="https://github.com/GSvegetable/pixel-daylight-switch">源码</a><a href="./README.md">文档</a></nav></header>
<main>
<section class="stage-col">
<div class="stage" id="stage"><iframe id="preview" title="开关预览"></iframe></div>
<p class="hint">拖动开关看效果。改完参数，点「应用」重建预览。</p>
</section>
<section class="panel">
<h2>场景</h2><div class="chips" id="chips"></div>
<h2>参数</h2>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="panes"></div>
<div class="codehead"><h2>嵌入代码</h2><button class="copy" id="copy">复制代码</button></div>
<pre id="snippet"></pre>
<div class="dock"><span id="status"></span><button class="apply" id="apply">应用</button></div>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const groups=[
 ['运动',[['speed','基础速度',3,20,.1],['friction','惯性阻尼',.1,.9,.01],['bounce','边缘回弹',0,12,.1]]],
 ['玻璃',[['refraction','折射强度',.5,2.5,.01],['bezel','边框厚度',.02,.09,.001],['dispersion','边缘色散',0,.25,.005],['shine','表面高光',0,1.5,.01]]],
 ['世界',[['timeSpeed','时间倍率',0,4,.05]]]
];
const nums=groups.flatMap(g=>g[1]);
const fields=[...nums.map(n=>n[0]),'weather','startNight'];
const attr={speed:'speed',friction:'friction',bounce:'bounce',refraction:'refraction',bezel:'bezel',dispersion:'dispersion',shine:'shine',timeSpeed:'time-speed',weather:'weather',startNight:'start-night'};
const defaults={speed:9.5,friction:.6,bounce:3.2,refraction:1.24,bezel:.046,dispersion:.05,shine:.44,timeSpeed:1,weather:'default',startNight:false};
const presets={
 default:{...defaults},
 cinematic:{speed:8.5,friction:.72,bounce:2.4,refraction:1.75,bezel:.055,dispersion:.16,shine:.82,timeSpeed:.8,weather:'default',startNight:false},
 snow:{speed:9.5,friction:.58,bounce:3.5,refraction:1.45,bezel:.046,dispersion:.1,shine:.58,timeSpeed:1.2,weather:'snow',startNight:true},
 frozen:{...defaults,timeSpeed:0,weather:'snow',startNight:true}
};
const names={default:'原始状态',cinematic:'电影玻璃',snow:'雪夜',frozen:'时间冻结'};
let applied=null,busy=false;

$('chips').innerHTML=Object.keys(names).map(k=>`<button class="chip" data-p="${k}" aria-pressed="${k==='default'}">${names[k]}</button>`).join('');
$('tabs').innerHTML=groups.map((g,i)=>`<button role="tab" id="t${i}" aria-selected="${i===0}" aria-controls="p${i}">${g[0]}</button>`).join('');
$('panes').innerHTML=groups.map((g,i)=>`<div role="tabpanel" id="p${i}" aria-labelledby="t${i}"${i?' hidden':''}>`+
 g[1].map(([id,name,min,max,step])=>`<div class="ctl"><div class="row"><label for="${id}">${name}</label><output id="${id}Out" for="${id}"></output></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}"></div>`).join('')+
 (i===2?`<div class="ctl"><div class="row"><label for="weather">天气</label><select id="weather"><option value="default">默认</option><option value="snow">飘雪</option></select></div></div><label class="check"><input id="startNight" type="checkbox">从夜晚开始</label>`:'')+
 '</div>').join('');

const fmt=(n,v)=>Number(v).toFixed((String(n[4]).split('.')[1]||'').length)+(n[0]==='timeSpeed'?'×':'');
const read=()=>{const c={};for(const id of fields)c[id]=id==='weather'?$(id).value:id==='startNight'?$(id).checked:Number($(id).value);return c};
const set=c=>{for(const id of fields){if(id==='startNight')$(id).checked=!!c[id];else $(id).value=c[id]}refresh()};

function code(){
 const c=read(),a=fields.filter(id=>c[id]!==defaults[id]).map(id=>`  data-${attr[id]}="${c[id]}"`);
 const el=a.length?['<div','  data-ld-part="toggle-daylight"',...a,'></div>'].join('\n'):'<div data-ld-part="toggle-daylight"></div>';
 $('snippet').textContent=el+'\n<script src="https://gsvegetable.github.io/pixel-daylight-switch/app.js"><\/script>';
}
function mark(){
 const dirty=JSON.stringify(read())!==JSON.stringify(applied);
 $('status').textContent=busy?'正在重建预览…':dirty?'有改动，尚未应用':'预览已是最新';
 $('apply').toggleAttribute('data-clean',!dirty&&!busy);
}
function refresh(){
 for(const n of nums){const el=$(n[0]);$(n[0]+'Out').textContent=fmt(n,el.value);el.style.setProperty('--p',(el.value-n[2])/(n[3]-n[2])*100+'%')}
 code();mark();
}
function night(on){
 document.documentElement.dataset.night=on?'1':'0';
 document.querySelector('meta[name=theme-color]').content=on?'#141936':'#dbe6ee';
}
function apply(){
 const c=read(),p=new URLSearchParams();
 for(const id of fields){if(id==='startNight'){if(c[id])p.set('start-night','true')}else p.set(attr[id],String(c[id]))}
 applied=c;busy=true;$('stage').classList.add('busy');night(c.startNight);
 const f=$('preview');
 f.onload=()=>{
  busy=false;$('stage').classList.remove('busy');
  try{f.contentDocument.addEventListener('daylight:change',e=>night(e.detail.night))}catch{}
  mark();
 };
 f.src='./preview.html?'+p;mark();
}
const unpress=()=>document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false'));

fields.forEach(id=>$(id).addEventListener(id==='weather'||id==='startNight'?'change':'input',()=>{unpress();refresh()}));
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
 set(presets[b.dataset.p]);unpress();b.setAttribute('aria-pressed','true');apply();
}));
const tabs=[...document.querySelectorAll('.tabs button')];
tabs.forEach((t,i)=>{
 t.addEventListener('click',()=>tabs.forEach((x,j)=>{x.setAttribute('aria-selected',j===i);$('p'+j).hidden=j!==i}));
 t.addEventListener('keydown',e=>{
  const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
  if(d){const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();n.click()}
 });
});
$('apply').addEventListener('click',apply);
$('copy').addEventListener('click',async()=>{
 const b=$('copy');
 try{await navigator.clipboard.writeText($('snippet').textContent);b.textContent='已复制'}
 catch{b.textContent='复制失败，请手动选中'}
 setTimeout(()=>b.textContent='复制代码',1600);
});
set(defaults);apply();
})();
</script>
</body>
</html>
